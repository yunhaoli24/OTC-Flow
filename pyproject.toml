[project]
name = "otc-flow"
version = "1.0.0"
description = "OT-Coupled Flow for unpaired CT-to-TEE translation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flow-matching>=1.0.0",
  "accelerate>=0.30",
  "monai>=1.4.0",
  "numpy>=1.26",
  "pillow>=10.0",
  "pytorch-lightning>=2.4.0",
  "safetensors>=0.4",
  "torch>=2.4",
  "transformers>=4.50",
]

[project.scripts]
otc-flow-train-vqvae = "scripts.train_vqvae:main"
otc-flow-train = "scripts.train_otc_flow:main"
otc-flow-infer = "scripts.infer:main"
otc-flow-convert-vqvae = "scripts.convert_vqvae:main"
otc-flow-convert-checkpoint = "scripts.convert_checkpoint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otc_flow", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
